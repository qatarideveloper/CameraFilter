name: Build CameraFilter (roothide)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: brew install ldid dpkg make

      - name: Set up roothide Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download iOS 16.5 SDK
        run: |
          cd $HOME/theos/sdks
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.zip -o sdks.zip
          unzip -q sdks.zip 'sdks-master/iPhoneOS16.5.sdk/*'
          mv sdks-master/*.sdk .
          rm -rf sdks-master sdks.zip

      - name: Build package
        run: |
          export THEOS=$HOME/theos
          make clean || true
          make package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: CameraFilter-deb
          path: packages/*.deb
